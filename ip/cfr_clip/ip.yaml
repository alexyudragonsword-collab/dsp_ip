name: cfr_clip
top: cfr_clip
rtl:
  - rtl/cfr_clip.sv
tb: rtl/tb_cfr_clip.sv
check: python
params: {}
probe: dspip.ip.cfr_clip.ref:probe
vector_sets:
  - {name: mixed, source: committed, dir: vectors/mixed}
compare:
  - {golden: env_clip.txt, rtl: rtl_env_clip.txt}
  - {golden: clipped.txt, rtl: rtl_clipped.txt}
target_rate_msps: 640    # one envelope sample per clock (polar_tx wifi_dtc: 160 MHz x 4)
latency_note: One sample per clock; env_clip / clipped registered (LATENCY = 1).
note: >
  Polar-domain CFR limiter, RTL of polar_tx export/rtl.py cfr_clip_golden (vendored).
  Vectors: polar_tx rtl_vectors cfr_clip (random words, then a WiFi-20 envelope).
