name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # runs the synth-long matrix (P = 1/2/4 real synthesis) on demand

env:
  PA_DPD_SHA: 5718b835f9d6e5cd3680252e5d9046ab08aae7be
  HALO_SHA: c59c2c834cbb226ef9d009f61270ec48eabd4692   # Halo_Serdes#148 head (stacked on #147); re-pin on merge
  OPENDPD_SHA: a362a8db618cb11249f310e12212a5bf7a6db9f9
  POLAR_TX_SHA: 70577381f678da34da20fcd083c5052afae1c437   # polar_tx#18 merge commit

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ tools/ examples/

  test:
    # Python side: references, config derivation, fingerprint, scaffold unit tests, docs
    # tables. No simulator here — tests/test_rtl_lockstep.py skips; the lockstep job runs it.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,upstream]"
      - run: python -m pytest -q
      - run: python tools/render_tables.py --check

  lockstep:
    # Rule 1: every IP, every vector set, every P, zero mismatches, both simulators, on two
    # toolchains: the distro packages (Verilator 5.020 / Icarus 12) and the pinned OSS CAD
    # Suite bundle (Verilator 5.053 / Icarus 14, tools/get_yosys.sh, DSPIP_SIM_BIN). The
    # mutation test proves the check is not vacuous; DSPIP_REQUIRE_SIM turns a skip into red.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [distro, bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install simulators (distro verilator + iverilog)
        if: matrix.toolchain == 'distro'
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Pinned OSS CAD Suite (tools/get_yosys.sh)
        if: matrix.toolchain == 'bundle'
        uses: actions/cache@v6
        with:
          path: third_party/dl
          key: oss-cad-suite-2026-10-25
      - name: Simulators from the pinned bundle
        if: matrix.toolchain == 'bundle'
        run: |
          tools/get_yosys.sh
          echo "DSPIP_SIM_BIN=$PWD/third_party/oss-cad-suite/bin" >> "$GITHUB_ENV"
      - run: pip install -e ".[test,upstream]"
      - run: tools/toolchain.sh
      - name: Lockstep, verilator
        run: python tools/lockstep.py --all --sim verilator
      - name: Lockstep, iverilog
        run: python tools/lockstep.py --all --sim iverilog
      - name: Lockstep + mutation tests, simulator quirk probes (pinned per version)
        run: DSPIP_REQUIRE_SIM=1 python -m pytest -q tests/test_rtl_lockstep.py tests/test_sim_quirks.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lockstep-reports-${{ matrix.toolchain }}
          path: |
            results/lockstep/*.json
            results/lockstep/**/sim.log
            results/lockstep/**/compile.log

  synth:
    # Rule 5: open flow only (pinned yosys + ABC + NanGate45); results are artifacts
    # and the committed results/synth/*.json are what docs/results.md is rendered from.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pinned yosys (OSS CAD Suite, tools/get_yosys.sh)
        uses: actions/cache@v6
        with:
          path: third_party/dl
          key: oss-cad-suite-2026-10-25
      - run: tools/get_yosys.sh
      - run: pip install -e ".[test,upstream]"
      - run: tools/get_liberty.sh
      - name: "Synthesize (hier mode: real term count, ABC per module)"
        run: |
          python tools/synth.py --ip sat_shift --set signed_w40_s12_o16 --out results/synth-ci/sat_shift.json
          python tools/synth.py --ip dpd_poly --set ddr_r1_w16 --P 1 --mode hier --out results/synth-ci/ddr_r1_w16_P1.json
          python tools/synth.py --ip dpd_poly --set gmp510_w16 --P 1 --mode hier --out results/synth-ci/gmp510_w16_P1.json
      - name: Synthesis tool tests
        run: python -m pytest -q tests/test_synth_tool.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synth-estimates
          path: |
            results/synth-ci/*.json
            results/synth/logs/**/yosys.log

  pnr:
    # Rule 5, with wires: OpenROAD place + CTS + global route of small blocks (pinned
    # OpenROAD, tools/get_openroad.sh); the dtc_dither point must reproduce its committed JSON.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pinned yosys + OpenROAD downloads
        uses: actions/cache@v6
        with:
          path: third_party/dl
          key: oss-cad-suite-2026-10-25-openroad-2.0-12381
      - run: tools/get_yosys.sh
      - run: tools/get_openroad.sh
      - run: pip install -e ".[test,upstream]"
      - run: tools/get_liberty.sh
      - name: OpenROAD platform files (NanGate45, pinned ORFS)
        run: git -C third_party/orfs sparse-checkout add flow/platforms/nangate45
      - name: Place and route, small blocks
        run: |
          python tools/pnr.py --ip dtc_dither --set ramp --out results/pnr-ci/dtc_dither.json
          python tools/pnr.py --ip dp_cal_lms --set ble_5pct --out results/pnr-ci/dp_cal_lms.json
      - name: P&R tool tests (the small block reproduces bit for bit)
        run: python -m pytest -q tests/test_pnr_tool.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnr-estimates
          path: |
            results/pnr-ci/*.json
            results/pnr/work/**/openroad.log

  synth-long:
    # Rule 5, the full picture: P = 1 / 2 / 4 hier points of both bases from one RTL version.
    # Manual trigger only (6 runners, up to a few hours each). The estimate JSON is printed
    # to the log and uploaded; copy it into results/synth/ (default file name) and re-run
    # tools/render_tables.py to publish it in docs/results.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        set: [ddr_r1_w16, gmp510_w16]
        P: [1, 2, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pinned yosys (OSS CAD Suite, tools/get_yosys.sh)
        uses: actions/cache@v6
        with:
          path: third_party/dl
          key: oss-cad-suite-2026-10-25
      - run: tools/get_yosys.sh
      - run: pip install -e ".[test,upstream]"
      - run: tools/get_liberty.sh
      - name: "Synthesize ${{ matrix.set }} P=${{ matrix.P }} (hier, real term count)"
        run: python tools/synth.py --ip dpd_poly --set ${{ matrix.set }} --P ${{ matrix.P }} --mode hier
      - name: "Print the estimate (copy into results/synth/ to publish)"
        run: cat results/synth/dpd_poly__${{ matrix.set }}__P${{ matrix.P }}__hier.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synth-long-${{ matrix.set }}-P${{ matrix.P }}
          path: |
            results/synth/dpd_poly__${{ matrix.set }}__P${{ matrix.P }}__hier.json
            results/synth/logs/**/yosys.log

  vendor-drift:
    # Rule 3: vendored Python/RTL matches PA_DPD / Halo_Serdes / polar_tx @SHA byte for byte;
    # the committed exports are what PA_DPD@SHA + OpenDPD@SHA (exact inputs/config, codes
    # within 1 LSB) and polar_tx@SHA (every dp_cal_lms / dtc_dither / polar_dpd_lut set, byte
    # for byte) still produce.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: ${{ env.PA_DPD_SHA }}
          path: _siblings/PA_DPD
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: alexyudragonsword-collab/Halo_Serdes
          ref: ${{ env.HALO_SHA }}
          path: _siblings/Halo_Serdes
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: alexyudragonsword-collab/polar_tx
          ref: ${{ env.POLAR_TX_SHA }}
          path: _siblings/polar_tx
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,upstream]"
      - name: Vendor drift (strict)
        run: python tools/vendor_check.py --strict --siblings PA_DPD=$PWD/_siblings/PA_DPD Halo_Serdes=$PWD/_siblings/Halo_Serdes polar_tx=$PWD/_siblings/polar_tx
      - name: Re-export every polar_tx vector set (dp_cal_lms, dtc_dither, polar_dpd_lut) and compare
        run: |
          pip install -e _siblings/polar_tx
          python tools/check_polartx_export.py --polar-tx _siblings/polar_tx
      - name: OpenDPD dataset (sparse)
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/lab-emi/OpenDPD _siblings/OpenDPD
          git -C _siblings/OpenDPD sparse-checkout set datasets/DPA_160MHz
          git -C _siblings/OpenDPD fetch --depth 1 origin $OPENDPD_SHA && git -C _siblings/OpenDPD checkout -q $OPENDPD_SHA
      - name: Re-export and compare with the committed upstream files
        run: python tools/check_upstream_export.py --pa-dpd _siblings/PA_DPD --dataset _siblings/OpenDPD/datasets/DPA_160MHz

  fixed-vs-float:
    # Rule 2: reproduce PA_DPD's ACLR table with its own code (neural surrogate, torch CPU)
    # and measure the integer reference against it. DSPIP_REQUIRE_TORCH turns a skip into red.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alexyudragonsword-collab/PA_DPD
          ref: ${{ env.PA_DPD_SHA }}
          path: _siblings/PA_DPD
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,upstream]"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: OpenDPD dataset (sparse)
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/lab-emi/OpenDPD _siblings/OpenDPD
          git -C _siblings/OpenDPD sparse-checkout set datasets/DPA_160MHz
          git -C _siblings/OpenDPD fetch --depth 1 origin $OPENDPD_SHA && git -C _siblings/OpenDPD checkout -q $OPENDPD_SHA
      - name: Fixed vs float (ACLR through the surrogate)
        env:
          DSPIP_REQUIRE_TORCH: "1"
          DSPIP_SIBLING_PA_DPD: ${{ github.workspace }}/_siblings/PA_DPD
          DSPIP_OPENDPD_DATASET: ${{ github.workspace }}/_siblings/OpenDPD/datasets/DPA_160MHz
        run: |
          python examples/01_bitwidth_aclr.py --out results/aclr_table_ci.json
          python -m pytest -q tests/test_fixed_vs_float.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aclr-table
          path: results/aclr_table_ci.json
