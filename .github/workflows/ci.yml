name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ tools/ examples/

  test:
    # Python side: references, config derivation, fingerprint, scaffold unit tests.
    # No simulator here — tests/test_rtl_lockstep.py skips; the lockstep job runs it for real.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,upstream]"
      - run: python -m pytest -q

  lockstep:
    # Rule 1: every IP, every vector set, zero mismatches, with both simulators; the
    # mutation test proves the check is not vacuous. DSPIP_REQUIRE_SIM turns a skip into red.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulators (verilator + iverilog)
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: pip install -e ".[test,upstream]"
      - run: tools/toolchain.sh
      - name: Lockstep, verilator
        run: python tools/lockstep.py --all --sim verilator
      - name: Lockstep, iverilog
        run: python tools/lockstep.py --all --sim iverilog
      - name: Lockstep + mutation tests
        run: DSPIP_REQUIRE_SIM=1 python -m pytest -q tests/test_rtl_lockstep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockstep-reports
          path: |
            results/lockstep/*.json
            results/lockstep/**/sim.log
            results/lockstep/**/compile.log
